services:
  - type: web
    name: toolifyx-video
    env: python
    plan: standard  # Upgrade from free for better CPU
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg libavcodec-extra58
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app \
        --bind 0.0.0.0:$PORT \
        --workers 2 \
        --threads 4 \
        --worker-class gthread \
        --worker-connections 1000 \
        --timeout 300 \
        --keep-alive 5 \
        --max-requests 1000 \
        --max-requests-jitter 100 \
        --access-logfile - \
        --error-logfile - \
        --preload
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_WORKERS
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: toolifyx-db
          property: connectionString

databases:
  - name: toolifyx-db
    plan: starter
