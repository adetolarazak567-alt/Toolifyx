services:
  - type: web
    name: toolifyx-video
    env: python
    plan: standard
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: |
      gunicorn app:app \
        --bind 0.0.0.0:$PORT \
        --workers 2 \
        --threads 4 \
        --worker-class gthread \
        --timeout 300 \
        --keep-alive 5 \
        --preload
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MAX_WORKERS
        value: "4"
